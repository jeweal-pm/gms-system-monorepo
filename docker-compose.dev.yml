x-dev-build: &dev-build
  context: .
  dockerfile: docker/dev.Dockerfile

x-dev-volumes: &dev-volumes
  - .:/app
  - dev-root-node-modules:/app/node_modules
  - dev-frontend-node-modules:/app/frontend/node_modules
  - dev-auth-node-modules:/app/backend-api-auth/node_modules
  - dev-frontend-next:/app/frontend/.next
  - dev-auth-prisma:/app/backend-api-auth/src/generated/prisma
  - dev-partner-node-modules:/app/backend-api-master/node_modules
  - dev-partner-prisma:/app/backend-api-master/src/generated/prisma

# Watch mode (compilers, Next dev server) needs more than the production limits (ADR-0024):
# a developer workstation, not the 4 GB / 2 vCPU host. Production heap caps are cleared.
x-dev-limits: &dev-limits
  resources:
    limits:
      cpus: "1"
      memory: 1536M

services:
  backend-api-auth:
    image: f1-system-dev:local
    build: *dev-build
    command: ["sh", "-c", "pnpm --filter @gem-crm/backend-api-auth db:generate && pnpm --filter @gem-crm/backend-api-auth db:migrate && pnpm --filter @gem-crm/backend-api-auth dev"]
    deploy: *dev-limits
    environment:
      NODE_ENV: development
      NODE_OPTIONS: ""
      LICENSE_MODE: ${LICENSE_MODE:-mock}
      LICENSE_API_URL: ${LICENSE_API_URL:-}
      LICENSE_INSTANCE_ID: ${LICENSE_INSTANCE_ID:-local-dev}
      LICENSE_INSTANCE_API_KEY: ${LICENSE_INSTANCE_API_KEY:-local-dev-only}
      LICENSE_JWT_ISSUER: ${LICENSE_JWT_ISSUER:-f1-system-license-dev}
      LICENSE_JWT_AUDIENCE: ${LICENSE_JWT_AUDIENCE:-f1-system-customer-backend}
      LICENSE_PUBLIC_KEYS_JSON: ${LICENSE_PUBLIC_KEYS_JSON:-}
      LICENSE_MOCK_KID: ${LICENSE_MOCK_KID:-}
      LICENSE_MOCK_PRIVATE_KEY_PKCS8_BASE64: ${LICENSE_MOCK_PRIVATE_KEY_PKCS8_BASE64:-}
    volumes: *dev-volumes

  frontend:
    image: f1-system-dev:local
    build: *dev-build
    command: ["pnpm", "--filter", "frontend", "dev"]
    deploy: *dev-limits
    environment:
      NODE_ENV: development
      NODE_OPTIONS: ""
    volumes: *dev-volumes

  # Dev watch profile: root dev image, bind mount + watch,
  # writable root. Networks stay internal (no egress, no published port).
  api-master:
    image: f1-system-dev:local
    build: *dev-build
    command: ["sh", "-c", "pnpm --filter @gem-crm/backend-api-master db:generate && pnpm --filter @gem-crm/backend-api-master db:migrate && exec pnpm --filter @gem-crm/backend-api-master dev"]
    environment:
      NODE_ENV: development
      # Dev only (stone-master, 2026-10-19): `nest start --watch` type-checks the larger generated
      # Prisma client (schema "stone") and ran out of heap at the 512M base limit. Production compiles
      # at image build and keeps the base 512M / --max-old-space-size=320.
      NODE_OPTIONS: --max-old-space-size=768
    deploy:
      resources:
        limits:
          memory: 1G
    read_only: false
    cap_drop: !reset []
    tmpfs: !reset []
    volumes: *dev-volumes

volumes:
  dev-root-node-modules:
  dev-frontend-node-modules:
  dev-auth-node-modules:
  dev-frontend-next:
  dev-auth-prisma:
  dev-partner-node-modules:
  dev-partner-prisma:
