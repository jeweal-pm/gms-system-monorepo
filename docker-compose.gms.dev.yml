# Local GMS ingress preview (SA migration revision 1, infra bundle gms-target/2).
# Overlay on docker-compose.yml + docker-compose.dev.yml. Keep the current services
# until auth/master route parity and rollback gates are verified.
services:
  nginx:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24@sha256:e2a8fca8aa356d66159aaf8a877a9c126773635adf210503eefaaeaffeed6ad7
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
          pids: 64
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/nginx/gms-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend-api-auth:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend-api-auth:
    environment:
      AUTH_BASE_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
