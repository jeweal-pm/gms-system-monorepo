version: 1

# Applies when the parallel staging promotion workflow is selected; explicit user branch instructions take precedence.
branch_policy:
  ai_base: staging
  ai_pull_request_target: staging
  promotion_source: staging
  promotion_target: develop
  direct_ai_merge_to_develop: false

integration_owned:
  - document/adr/tech-stack.md
  - document/task/frontend-latest.md
  - document/task/index.md
  - document/infra/service-index.md
  - document/devops/service-index.md
  - .github/**
  - package.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - frontend/Dockerfile
  - backend-api-*/Dockerfile
  - docker-compose.yml
  - docker-compose.*.yml
  - docker-compose*.yaml
  - compose*.yml
  - compose*.yaml
  - docker/**
  - .dockerignore
  - .env.example
  - frontend/package.json
  - frontend/next.config.ts
  - frontend/src/app/api/**
  - frontend/src/providers/**
  - backend-api-*/package.json
  - backend-api-*/src/app.module.ts
  - backend-api-*/src/main.ts
  - backend-api-auth/prisma/**

scopes:
  devops-docs:
    paths:
      - document/devops/**
  infra-docs:
    paths:
      - document/infra/**
  ui-spec-docs:
    paths:
      - document/apps/frontend/**
  sa-design-docs:
    paths:
      - document/apps/backend/**
      - document/adr/**
      - document/diagram/**
  frontend-feature:
    paths:
      - frontend/src/features/<feature>/**
      - frontend/src/app/<route>/**
  backend-service:
    paths:
      - backend-api-<service>/src/**
  role-reports:
    paths:
      - document/reviews/**
      - document/testing/automated/**
  audit-investigation:
    paths:
      - document/task/investigation/**
  frontend-auth:
    paths:
      - frontend/src/features/auth/**
      - frontend/src/app/login/**
      - frontend/src/app/forgot-password/**
      - frontend/src/app/settings/**
  frontend-home:
    paths:
      - frontend/src/features/home/**
      - frontend/src/app/modules/**
  manual-test-reports:
    paths:
      - document/testing/user-check/**
  backend-gateway-rpc:
    paths:
      - backend-api-gateway/src/trpc/**
      - backend-api-gateway/src/app.controller.ts
  backend-auth:
    paths:
      - backend-api-auth/src/auth/**
      - backend-api-auth/src/email/**
      - backend-api-auth/src/scripts/**
  integration-frontend-shared:
    paths:
      - frontend/src/providers/**
      - frontend/src/lib/**

rules:
  one_active_owner_per_scope: true
  dependency_changes_are_serial: true
  cross_scope_changes_require_handoff: true
  combined_recheck_on_staging: true
