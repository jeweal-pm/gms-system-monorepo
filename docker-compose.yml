# Production host: 4 GB RAM / 2 vCPU (ADR-0024, project owner). App caps total 1.65 vCPU / 2816 MiB
# (incl. backend-api-inventory 0.20 vCPU / 256 MiB, ADR-0052 D14); the GMS Nginx overlay adds 0.1 vCPU / 64 MiB
# for 1.75 vCPU / 2880 MiB, preserving host headroom; see document/infra/capacity.md.
# Node heaps are capped below each memory limit. docker-compose.dev.yml raises the limits for watch mode.
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 256mb
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 1G
    environment:
      POSTGRES_DB: f1_system
      POSTGRES_USER: f1_user
      POSTGRES_PASSWORD: f1_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - default
      - partner-db
      # ADR-0052 D1 / infra bundle backend-api-inventory/1: dedicated internal DB network for inventory.
      - inventory-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1_user -d f1_system"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-api-auth:
    build:
      context: .
      dockerfile: backend-api-auth/Dockerfile
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 512M
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=320
      PORT: 3101
      DATABASE_URL: postgresql://f1_user:f1_dev_password@postgres:5432/f1_system
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-this-to-at-least-32-characters}
      AUTH_BASE_URL: http://localhost:3101
      FRONTEND_URL: http://localhost:3000
      CRM_API_KEY: ${CRM_API_KEY:-local-development-crm-key-change-before-deploy}
      LICENSE_MODE: ${LICENSE_MODE:-remote}
      LICENSE_API_URL: ${LICENSE_API_URL:-}
      LICENSE_INSTANCE_ID: ${LICENSE_INSTANCE_ID:-}
      LICENSE_INSTANCE_API_KEY: ${LICENSE_INSTANCE_API_KEY:-}
      LICENSE_JWT_ISSUER: ${LICENSE_JWT_ISSUER:-}
      LICENSE_JWT_AUDIENCE: ${LICENSE_JWT_AUDIENCE:-f1-system-customer-backend}
      LICENSE_PUBLIC_KEYS_JSON: ${LICENSE_PUBLIC_KEYS_JSON:-}
      LICENSE_MOCK_KID: ${LICENSE_MOCK_KID:-}
      LICENSE_MOCK_PRIVATE_KEY_PKCS8_BASE64: ${LICENSE_MOCK_PRIVATE_KEY_PKCS8_BASE64:-}
    # Infra bundle backend-api-auth/1 (user-photo SA PH-10): the only new writable path is the
    # user photo folder (storage/user-photos/<userId>); photos survive container recreation.
    volumes:
      - auth-storage:/app/backend-api-auth/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3101:3101"

  # GMS api-master adapts the existing partner process and preserves partner/stone schemas.
  # Internal-only: published only through Nginx in the GMS profile; reaches postgres (partner-db).
  api-master:
    build:
      context: .
      dockerfile: backend-api-master/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
          # pids limit (bundle "pids_limit: 128"); Compose v5 rejects pids_limit next to deploy limits
          pids: 128
    environment:
      NODE_ENV: production
      PORT: 3201
      NODE_OPTIONS: --max-old-space-size=256
      CHECKPOINT_DISABLE: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      GMS_STORAGE_ROOT: /app/backend-api-master/storage
      PARTNER_DATABASE_URL: ${PARTNER_CONTAINER_DATABASE_URL:-postgresql://f1_user:f1_dev_password@postgres:5432/f1_system?schema=partner}
      PARTNER_SERVICE_TOKEN: ${PARTNER_SERVICE_TOKEN:?PARTNER_SERVICE_TOKEN must be set (see .env.example)}
    # User uploads live on the persistent host filesystem, outside the container layer.
    volumes:
      - type: bind
        source: ${GMS_STORAGE_HOST_PATH:-/srv/gms/storage}
        target: /app/backend-api-master/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - partner-db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3201/health/ready',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # no ports: must not be published (ADR-0018)

  # ADR-0052 D1/D13/D14, infra bundle document/infra/services/backend-api-inventory/1/security.md.
  # Hono on Node; owns schema `inventory`. Internal only: reached through Nginx (GMS overlay), never published.
  # The GMS overlay adds its auth/master service tokens, authz reader URL and the auth/master/web networks.
  backend-api-inventory:
    build:
      context: .
      dockerfile: backend-api-inventory/Dockerfile
    image: f1-system-backend-api-inventory:local
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
          pids: 128
    environment:
      NODE_ENV: production
      PORT: 3301
      NODE_OPTIONS: --max-old-space-size=160
      CHECKPOINT_DISABLE: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      GMS_STORAGE_ROOT: /app/backend-api-inventory/storage
      # Runtime role gms_inventory_app (schema inventory DML only); no superuser fallback. Left empty when unset so
      # postgres-only commands (pnpm infra:up) keep working; the service refuses to start without it (fail closed).
      INVENTORY_DATABASE_URL: ${INVENTORY_DATABASE_URL:-}
    # Inventory's own persistent upload root (not master's); the app writes only files/load-to-stock/.
    volumes:
      - type: bind
        source: ${GMS_INVENTORY_STORAGE_HOST_PATH:-/srv/gms/inventory-storage}
        target: /app/backend-api-inventory/storage
    depends_on:
      postgres:
        condition: service_healthy
      backend-api-inventory-migrate:
        condition: service_completed_successfully
    networks:
      - inventory-db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3301/health/ready',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # no ports: must not be published (ADR-0052 D1)

  # One-off migration job (ADR-0052, handoff INF-LS-001): runs after master is healthy (master migrates
  # at its own start) and before the inventory service; never concurrent with the app. Role gms_inventory_migrator.
  backend-api-inventory-migrate:
    build:
      context: .
      dockerfile: backend-api-inventory/Dockerfile
    image: f1-system-backend-api-inventory:local
    restart: "no"
    init: true
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
          pids: 128
    environment:
      NODE_ENV: production
      CHECKPOINT_DISABLE: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      # Unset -> prisma migrate deploy fails with no datasource and the service does not start.
      INVENTORY_MIGRATE_DATABASE_URL: ${INVENTORY_MIGRATE_DATABASE_URL:-}
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
      api-master:
        condition: service_healthy
    networks:
      - inventory-db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 640M
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      PORT: 3000
      AUTH_SERVICE_URL: http://backend-api-auth:3101
      MASTER_SERVICE_URL: http://api-master:3201
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  # Retained unchanged as a rollback/source volume while the existing files are copied to host storage.
  partner-storage:
  auth-storage:

networks:
  partner-db:
    internal: true
  inventory-db:
    internal: true
