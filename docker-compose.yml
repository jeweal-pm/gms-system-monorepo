services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 2G
    environment:
      POSTGRES_DB: f1_system
      POSTGRES_USER: f1_user
      POSTGRES_PASSWORD: f1_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - default
      - partner-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1_user -d f1_system"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-api-auth:
    build:
      context: .
      dockerfile: backend-api-auth/Dockerfile
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
    environment:
      NODE_ENV: production
      PORT: 3101
      DATABASE_URL: postgresql://f1_user:f1_dev_password@postgres:5432/f1_system
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-this-to-at-least-32-characters}
      AUTH_BASE_URL: http://localhost:3101
      FRONTEND_URL: http://localhost:3000
      CRM_API_KEY: ${CRM_API_KEY:-local-development-crm-key-change-before-deploy}
      LICENSE_MODE: ${LICENSE_MODE:-remote}
      LICENSE_API_URL: ${LICENSE_API_URL:-}
      LICENSE_INSTANCE_ID: ${LICENSE_INSTANCE_ID:-}
      LICENSE_INSTANCE_API_KEY: ${LICENSE_INSTANCE_API_KEY:-}
      LICENSE_JWT_ISSUER: ${LICENSE_JWT_ISSUER:-}
      LICENSE_JWT_AUDIENCE: ${LICENSE_JWT_AUDIENCE:-f1-system-customer-backend}
      LICENSE_PUBLIC_KEYS_JSON: ${LICENSE_PUBLIC_KEYS_JSON:-}
      LICENSE_MOCK_KID: ${LICENSE_MOCK_KID:-}
      LICENSE_MOCK_PRIVATE_KEY_PKCS8_BASE64: ${LICENSE_MOCK_PRIVATE_KEY_PKCS8_BASE64:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3101:3101"

  backend-api-gateway:
    build:
      context: .
      dockerfile: backend-api-gateway/Dockerfile
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
    environment:
      NODE_ENV: production
      PORT: 4000
      AUTH_SERVICE_URL: http://backend-api-auth:3101
      CRM_API_KEY: ${CRM_API_KEY:-local-development-crm-key-change-before-deploy}
      PARTNER_SERVICE_URL: http://backend-api-partner:3201
      PARTNER_SERVICE_TOKEN: ${PARTNER_SERVICE_TOKEN:?PARTNER_SERVICE_TOKEN must be set (see .env.example)}
    depends_on:
      backend-api-auth:
        condition: service_started
      backend-api-partner:
        condition: service_started
    networks:
      - default
      - partner-api
    ports:
      - "4000:4000"

  # ADR-0018 / infra bundle backend-api-partner/1 (approved 2026-10-14, D1-D4 recommended).
  # Internal-only: no published port; reachable only from the gateway (partner-api) and
  # reaches only postgres (partner-db). Both networks are internal (no internet egress).
  backend-api-partner:
    build:
      context: .
      dockerfile: backend-api-partner/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: 512M
          # pids limit (bundle "pids_limit: 128"); Compose v5 rejects pids_limit next to deploy limits
          pids: 128
    environment:
      NODE_ENV: production
      PORT: 3201
      NODE_OPTIONS: --max-old-space-size=320
      CHECKPOINT_DISABLE: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      PARTNER_DATABASE_URL: ${PARTNER_CONTAINER_DATABASE_URL:-postgresql://f1_user:f1_dev_password@postgres:5432/f1_system?schema=partner}
      PARTNER_SERVICE_TOKEN: ${PARTNER_SERVICE_TOKEN:?PARTNER_SERVICE_TOKEN must be set (see .env.example)}
    # Infra bundle backend-api-partner/2 (company-profile SA rev 2): the only writable path is the
    # company logo folder; the root filesystem stays read-only.
    volumes:
      - partner-storage:/app/backend-api-partner/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - partner-api
      - partner-db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3201/health/ready',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # no ports: must not be published (ADR-0018)

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 1280M
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://backend-api-auth:3101
      GATEWAY_URL: http://backend-api-gateway:4000
    depends_on:
      backend-api-gateway:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  partner-storage:

networks:
  partner-api:
    internal: true
  partner-db:
    internal: true
