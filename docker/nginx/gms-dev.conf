map $http_upgrade $gms_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=gms_login:1m rate=5r/m;

server {
    listen 8080;
    server_name _;
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $gms_connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;

    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(internal|_storage)(/|$) {
        return 404;
    }

    location = /api/auth/sign-in/username {
        limit_req zone=gms_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend-api-auth:3101;
    }

    location ^~ /api/auth/ {
        proxy_pass http://backend-api-auth:3101;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
