map $http_upgrade $gms_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=gms_login:1m rate=5r/m;

server {
    listen 8080;
    server_name _;
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $gms_connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;

    location = /nginx-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /internal {
        return 404;
    }

    location ^~ /internal/ {
        return 404;
    }

    location ~ ^/_storage(/|$) {
        return 404;
    }

    location = /api/auth/sign-in/username {
        limit_req zone=gms_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend-api-auth:3101;
    }

    location ^~ /api/auth/ {
        proxy_pass http://backend-api-auth:3101;
    }

    location = /api/v1/company-profile/logo {
        proxy_pass http://api-master:3201;
    }

    # Quotation line photos (SA-QT-14): upload ≤ 5 MB + read by id, served by api-master.
    location ^~ /api/v1/quotation/photos {
        client_max_body_size 6m;
        proxy_pass http://api-master:3201;
    }

    # Memo Receive line photos (memo-receive SA-MR-19): upload ≤ 5 MB + read by id, served by api-master.
    location ^~ /api/v1/memo-receive/photos {
        client_max_body_size 6m;
        proxy_pass http://api-master:3201;
    }

    # Purchase Order line photos (purchase-order SA-PO-12): upload ≤ 5 MB + read by id, served by api-master.
    location ^~ /api/v1/purchase-order/photos {
        client_max_body_size 6m;
        proxy_pass http://api-master:3201;
    }


    # Reserve line photos (ADR-0048, owner 2026-11-11): upload ≤ 5 MB + read by id, served by api-master.
    location ^~ /api/v1/reserve/photos {
        client_max_body_size 6m;
        proxy_pass http://api-master:3201;
    }


    # Memo Return line photos (ADR-0048, owner 2026-11-11): upload ≤ 5 MB + read by id, served by api-master.
    location ^~ /api/v1/memo-return/photos {
        client_max_body_size 6m;
        proxy_pass http://api-master:3201;
    }


    # Memo Out line photos (ADR-0048, owner 2026-11-11): upload ≤ 5 MB + read by id, served by api-master.
    location ^~ /api/v1/memo-out/photos {
        client_max_body_size 6m;
        proxy_pass http://api-master:3201;
    }


    # Memo Out Return line photos (ADR-0048, owner 2026-11-11): upload ≤ 5 MB + read by id, served by api-master.
    location ^~ /api/v1/memo-out-return/photos {
        client_max_body_size 6m;
        proxy_pass http://api-master:3201;
    }


    # Purchase line photos (ADR-0048, owner 2026-11-11): upload ≤ 5 MB + read by id, served by api-master.
    location ^~ /api/v1/purchase/photos {
        client_max_body_size 6m;
        proxy_pass http://api-master:3201;
    }

    location ^~ /api/v1/ {
        proxy_pass http://backend-api-auth:3101;
    }

    # Notification stream (ADR-0049 D6, INF-NT-001): server-sent events, never buffered or cached; the server pings
    # every 25 s and ends the stream before the access token expires, so 120 s idle is ample.
    location = /api/master/notifications/stream {
        proxy_pass http://api-master:3201;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /api/master/ {
        proxy_pass http://api-master:3201;
    }

    location = /api/master/trpc {
        proxy_pass http://api-master:3201;
    }

    location ^~ /api/master/trpc/ {
        proxy_pass http://api-master:3201;
    }

    # backend-api-inventory (ADR-0052 D1/D12/D13, infra bundle backend-api-inventory/1). REST /api/inventory/v1 only.
    # Dev only: resolved per request through Docker DNS so Nginx (and every other page) still starts when the
    # inventory service is not set up or not running on this machine; inventory routes then answer 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gms_inventory_upstream backend-api-inventory:3301;
    # A raw backslash in the path is rejected: @hono/node-server < 1.19.18 / < 2.1.6 rewrote it to "/" after this
    # proxy's path checks (GHSA-jpvv-r467-5p4w). No proxy_set_header here, so the server-level headers are inherited.

    # Notification stream (ADR-0049 D6 / ADR-0052 D12): SSE, never buffered or cached; the server pings every 25 s.
    location = /api/inventory/v1/notifications/stream {
        if ($request_uri ~ "^[^?]*\\\\") { return 400; }
        proxy_pass http://$gms_inventory_upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Load to Stock row photos (ADR-0052 D13, ADR-0048): upload ≤ 5 MB + read by id.
    location ^~ /api/inventory/v1/load-to-stock/photos {
        if ($request_uri ~ "^[^?]*\\\\") { return 400; }
        client_max_body_size 6m;
        proxy_pass http://$gms_inventory_upstream;
    }

    # Sale row photos (ADR-0054 D9, ADR-0048; INF-SL-001): upload ≤ 5 MB + read by id.
    location ^~ /api/inventory/v1/sale/photos {
        if ($request_uri ~ "^[^?]*\\\\") { return 400; }
        client_max_body_size 6m;
        proxy_pass http://$gms_inventory_upstream;
    }

    location ^~ /api/inventory/ {
        if ($request_uri ~ "^[^?]*\\\\") { return 400; }
        client_max_body_size 256k;
        proxy_pass http://$gms_inventory_upstream;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
