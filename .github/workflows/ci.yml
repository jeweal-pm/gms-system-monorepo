name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: f1-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint all workspaces
        run: pnpm lint
      - name: Build all workspaces and generate Prisma/Next types
        run: pnpm build
      - name: Typecheck after generated types exist
        run: pnpm typecheck
      - name: Validate base and development Compose syntax
        # Compose requires PARTNER_SERVICE_TOKEN (`:?`). This fixed, non-secret literal only
        # satisfies interpolation for `config`; nothing is started or deployed with it.
        env:
          PARTNER_SERVICE_TOKEN: ci-compose-config-validation-only-not-a-secret
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
